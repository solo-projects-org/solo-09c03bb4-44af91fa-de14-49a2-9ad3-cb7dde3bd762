<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>罕见病病例合计发布核查</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#222;line-height:1.5}
  h1{font-size:1.4rem;border-bottom:2px solid #e5e7eb;padding-bottom:.4rem}
  h2{font-size:1.1rem;margin-top:1.8rem}
  table{border-collapse:collapse;margin:.8rem 0;width:100%}
  th,td{border:1px solid #d1d5db;padding:.4rem .6rem;text-align:left}
  th{background:#f3f4f6}
  .badge{background:#fef08a;color:#713f12;border-radius:.25rem;padding:.05rem .4rem;font-size:.8rem;white-space:nowrap}
  .ok{background:#dcfce7;border:1px solid #16a34a;padding:.6rem .8rem;border-radius:.4rem;margin:.8rem 0}
  .err{background:#fee2e2;border:1px solid #dc2626;padding:.6rem .8rem;border-radius:.4rem;margin:.8rem 0}
  .warn{background:#fef9c3;border:1px solid #ca8a04;padding:.6rem .8rem;border-radius:.4rem;margin:.8rem 0}
  button{padding:.5rem 1.1rem;font-size:1rem;cursor:pointer;border:1px solid #2563eb;background:#2563eb;color:#fff;border-radius:.35rem}
  button:hover{background:#1d4ed8}
  .muted{color:#6b7280;font-size:.9rem}
  label.grp{display:inline-block;margin:.15rem 1rem .15rem 0;padding:.25rem .5rem;border:1px solid #d1d5db;border-radius:.35rem}
  code{background:#f3f4f6;padding:.05rem .3rem;border-radius:.25rem}
</style>
</head>
<body>
<h1>罕见病研究病例合计发布核查</h1>
{% block content %}{% endblock %}
</body>
</html>
